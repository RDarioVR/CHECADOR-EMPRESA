<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHECADOR - PAROTA 1</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 20px 10px;
      margin: 0;
    }

    .contenedor {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    h3 {
      margin-top: 0;
      color: #555;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      color: white;
      cursor: pointer;
    }

    .registrar {
      background: #444;
    }

    .entrada {
      background: #16803c;
    }

    .salida {
      background: #b42318;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 15px;
      display: none;
      transform: scaleX(-1);
    }

    #mensaje {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    #estado {
      color: #666;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>CHECADOR</h1>
  <h3>PAROTA 1</h3>

  <p id="estado">Cargando reconocimiento facial...</p>

  <button class="registrar" onclick="registrarRostro()">
    👤 REGISTRAR MI CARA
  </button>

  <button class="entrada" onclick="checar('ENTRADA')">
    🟢 ENTRADA
  </button>

  <button class="salida" onclick="checar('SALIDA')">
    🔴 SALIDA
  </button>

  <video id="camara" autoplay playsinline muted></video>

  <p id="mensaje"></p>

</div>

<script>

const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js-models@master/";

let modelosListos = false;
let stream = null;


/* =========================
   CARGAR MODELOS
========================= */

async function cargarModelos() {

  const estado = document.getElementById("estado");

  try {

    estado.innerText = "Cargando reconocimiento facial...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      MODEL_URL + "tiny_face_detector"
    );

    await faceapi.nets.faceLandmark68Net.loadFromUri(
      MODEL_URL + "face_landmark_68"
    );

    await faceapi.nets.faceRecognitionNet.loadFromUri(
      MODEL_URL + "face_recognition"
    );

    modelosListos = true;

    estado.innerText = "Reconocimiento facial listo ✅";

  } catch (error) {

    console.error(error);

    estado.innerText =
      "❌ Error cargando reconocimiento facial.";

  }
}


/* =========================
   ABRIR CÁMARA
========================= */

async function abrirCamara() {

  const video = document.getElementById("camara");
  const mensaje = document.getElementById("mensaje");

  try {

    if (!stream) {

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: {
            ideal: 640
          },
          height: {
            ideal: 480
          }
        },
        audio: false
      });

      video.srcObject = stream;

    }

    video.style.display = "block";

    mensaje.innerText = "📷 Coloca tu rostro frente a la cámara.";

    await video.play();

    return video;

  } catch (error) {

    console.error(error);

    mensaje.innerText =
      "❌ No se pudo abrir la cámara.";

    return null;
  }
}


/* =========================
   OBTENER ROSTRO
========================= */

async function obtenerRostro() {

  const video = document.getElementById("camara");

  const resultado =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  return resultado;
}


/* =========================
   REGISTRAR A RUBÉN
========================= */

async function registrarRostro() {

  const mensaje = document.getElementById("mensaje");

  if (!modelosListos) {

    mensaje.innerText =
      "⏳ El reconocimiento todavía está cargando.";

    return;
  }

  const video = await abrirCamara();

  if (!video) return;

  mensaje.innerText =
    "👤 Mira directamente a la cámara...";

  await esperar(1500);

  let descriptores = [];

  for (let i = 0; i < 5; i++) {

    mensaje.innerText =
      "📸 Registrando rostro " + (i + 1) + " de 5...";

    await esperar(700);

    const rostro = await obtenerRostro();

    if (rostro) {

      descriptores.push(
        Array.from(rostro.descriptor)
      );

    }
  }

  if (descriptores.length < 3) {

    mensaje.innerText =
      "❌ No se pudo registrar correctamente. Mira de frente a la cámara.";

    return;
  }

  localStorage.setItem(
    "rostro_Ruben",
    JSON.stringify(descriptores)
  );

  mensaje.innerText =
    "✅ RUBÉN REGISTRADO CORRECTAMENTE";

}


/* =========================
   RECONOCER
========================= */

async function reconocerRostro() {

  const datos =
    localStorage.getItem("rostro_Ruben");

  if (!datos) {

    return false;
  }

  const rostrosGuardados =
    JSON.parse(datos);

  const video = document.getElementById("camara");

  const rostro =
    await obtenerRostro();

  if (!rostro) {

    return false;
  }

  let distanciaMinima = Infinity;

  for (const guardado of rostrosGuardados) {

    const distancia =
      distanciaEuclidiana(
        rostro.descriptor,
        new Float32Array(guardado)
      );

    if (distancia < distanciaMinima) {

      distanciaMinima = distancia;
    }
  }

  console.log(
    "Distancia facial:",
    distanciaMinima
  );

  /*
    Umbral inicial de prueba.
    Después lo ajustaremos con pruebas reales.
  */

  return distanciaMinima < 0.50;
}


/* =========================
   ENTRADA / SALIDA
========================= */

async function checar(tipo) {

  const mensaje =
    document.getElementById("mensaje");

  if (!modelosListos) {

    mensaje.innerText =
      "⏳ Espera a que cargue el reconocimiento.";

    return;
  }

  if (!localStorage.getItem("rostro_Ruben")) {

    mensaje.innerText =
      "⚠️ Primero registra la cara de Rubén.";

    return;
  }

  const video = await abrirCamara();

  if (!video) return;

  mensaje.innerText =
    "🔍 Verificando identidad...";

  await esperar(1000);

  const reconocido =
    await reconocerRostro();

  if (reconocido) {

    mensaje.innerText =
      "✅ RUBÉN IDENTIFICADO — " + tipo;

  } else {

    mensaje.innerText =
      "❌ PERSONA NO AUTORIZADA";

  }
}


/* =========================
   DISTANCIA FACIAL
========================= */

function distanciaEuclidiana(a, b) {

  let suma = 0;

  for (let i = 0; i < a.length; i++) {

    const diferencia =
      a[i] - b[i];

    suma +=
      diferencia * diferencia;
  }

  return Math.sqrt(suma);
}


/* =========================
   ESPERAR
========================= */

function esperar(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/* =========================
   INICIAR
========================= */

cargarModelos();

</script>

</body>
</html>
