<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHECADOR - PAROTA 1</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 20px 10px;
      margin: 0;
    }

    .contenedor {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    h3 {
      margin-top: 0;
      color: #555;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: 0;
      border-radius: 12px;
      font-size: 20px;
      color: white;
      cursor: pointer;
    }

    .entrada {
      background: #16803c;
    }

    .salida {
      background: #b42318;
    }

    .camara {
      position: relative;
      width: 100%;
      margin-top: 15px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      display: none;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #mensaje {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .estado {
      font-size: 15px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>CHECADOR</h1>
  <h3>PAROTA 1</h3>

  <p class="estado" id="estado">
    Preparando reconocimiento facial...
  </p>

  <button class="entrada" onclick="iniciarCamara()">
    🟢 ENTRADA
  </button>

  <button class="salida" onclick="iniciarCamara()">
    🔴 SALIDA
  </button>

  <div class="camara">
    <video id="camara" autoplay playsinline muted></video>
  </div>

  <p id="mensaje"></p>

</div>

<script>

let video;
let canvas;
let analizando = false;

async function cargarModelo() {

  const estado = document.getElementById("estado");

  try {

    estado.innerText = "Cargando reconocimiento facial...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js-models@master/tiny_face_detector"
    );

    estado.innerText = "Reconocimiento facial listo ✅";

  } catch (error) {

    console.error(error);

    estado.innerText =
      "❌ No se pudo cargar el reconocimiento facial.";

  }

}

async function iniciarCamara() {

  const mensaje = document.getElementById("mensaje");

  video = document.getElementById("camara");

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: {
          ideal: 640
        },
        height: {
          ideal: 480
        }
      },
      audio: false
    });

    video.srcObject = stream;
    video.style.display = "block";

    mensaje.innerText = "📷 Buscando rostro...";

    video.onloadedmetadata = () => {

      analizarRostro();

    };

  } catch (error) {

    console.error(error);

    mensaje.innerText =
      "❌ No se pudo abrir la cámara.";

  }

}

async function analizarRostro() {

  if (analizando) return;

  analizando = true;

  canvas = faceapi.createCanvasFromMedia(video);

  document.querySelector(".camara").appendChild(canvas);

  const dimensiones = {
    width: video.videoWidth,
    height: video.videoHeight
  };

  faceapi.matchDimensions(canvas, dimensiones);

  setInterval(async () => {

    if (video.readyState !== 4) return;

    const detecciones =
      await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      );

    const redimensionadas =
      faceapi.resizeResults(
        detecciones,
        dimensiones
      );

    const contexto = canvas.getContext("2d");

    contexto.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    faceapi.draw.drawDetections(
      canvas,
      redimensionadas
    );

    const mensaje =
      document.getElementById("mensaje");

    if (detecciones.length === 0) {

      mensaje.innerText =
        "👤 Coloca tu rostro frente a la cámara";

    } else if (detecciones.length === 1) {

      mensaje.innerText =
        "✅ Rostro detectado";

    } else {

      mensaje.innerText =
        "⚠️ Solo debe haber una persona frente a la cámara";

    }

  }, 300);

}

cargarModelo();

</script>

</body>
</html>
