<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHECADOR - PAROTA 1</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      margin: 0;
      padding: 20px 15px;
    }

    .contenedor {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
    }

    h1 {
      margin-bottom: 5px;
    }

    h3 {
      margin-top: 0;
      color: #555;
    }

    video {
      width: 100%;
      border-radius: 18px;
      margin-top: 15px;
      transform: scaleX(-1);
      background: #000;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      color: white;
    }

    .registrar {
      background: #555;
    }

    .entrada {
      background: #16a637;
    }

    .salida {
      background: #d92121;
    }

    .mensaje {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 25px;
    }

    .estado {
      font-size: 16px;
      color: #555;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>CHECADOR</h1>
  <h3>PAROTA 1</h3>

  <div class="estado" id="estado">
    Cargando reconocimiento facial...
  </div>

  <video id="video" autoplay muted playsinline></video>

  <button class="registrar" onclick="registrarCara()">
    👤 REGISTRAR MI CARA
  </button>

  <button class="entrada" onclick="marcar('ENTRADA')">
    🟢 ENTRADA
  </button>

  <button class="salida" onclick="marcar('SALIDA')">
    🔴 SALIDA
  </button>

  <div class="mensaje" id="mensaje"></div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwHwlML5bF7mxs9lq3bJsmomtc2dJPFZYcB3LeneEE8DvQ4jH_RbudHYhYE0IB6ZX8W/exec";

const SUCURSAL = "PAROTA 1";

const EMPLEADO = "Rubén";

const DISTANCIA_MAXIMA = 0.55;


/* =========================================================
   VARIABLES
========================================================= */

let video = document.getElementById("video");

let estado = document.getElementById("estado");

let mensaje = document.getElementById("mensaje");

let modeloListo = false;

let descriptorRegistrado = null;

let procesando = false;


/* =========================================================
   INICIAR
========================================================= */

async function iniciar() {

  try {

    estado.innerText = "Cargando reconocimiento facial...";

    await Promise.all([

      faceapi.nets.tinyFaceDetector.loadFromUri(
        "https://justadudewhohacks.github.io/face-api.js/models"
      ),

      faceapi.nets.faceLandmark68Net.loadFromUri(
        "https://justadudewhohacks.github.io/face-api.js/models"
      ),

      faceapi.nets.faceRecognitionNet.loadFromUri(
        "https://justadudewhohacks.github.io/face-api.js/models"
      )

    ]);

    modeloListo = true;

    await iniciarCamara();

    cargarCaraRegistrada();

  } catch (error) {

    console.error(error);

    estado.innerText =
      "❌ Error al cargar reconocimiento facial";

    mensaje.innerText =
      "Revisa tu conexión a internet.";

  }

}


/* =========================================================
   CÁMARA
========================================================= */

async function iniciarCamara() {

  const stream = await navigator.mediaDevices.getUserMedia({

    video: {
      facingMode: "user",
      width: {
        ideal: 640
      },
      height: {
        ideal: 480
      }
    },

    audio: false

  });

  video.srcObject = stream;

  estado.innerText =
    "Reconocimiento facial listo ✅";

}


/* =========================================================
   CARGAR CARA
========================================================= */

function cargarCaraRegistrada() {

  const guardada =
    localStorage.getItem("cara_ruben");

  if (!guardada) {

    estado.innerText =
      "⚠️ Rubén todavía no está registrado";

    return;

  }

  descriptorRegistrado =
    new Float32Array(JSON.parse(guardada));

  estado.innerText =
    "Rubén registrado correctamente ✅";

}


/* =========================================================
   DETECTAR ROSTRO
========================================================= */

async function detectarRostro() {

  if (!modeloListo) {
    return null;
  }

  const deteccion =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  return deteccion;

}


/* =========================================================
   REGISTRAR CARA
========================================================= */

async function registrarCara() {

  if (procesando) return;

  procesando = true;

  mensaje.innerText =
    "📷 Mira directamente a la cámara...";

  const descriptores = [];

  for (let i = 0; i < 5; i++) {

    await esperar(700);

    const deteccion =
      await detectarRostro();

    if (!deteccion) {

      mensaje.innerText =
        "❌ No pude detectar tu rostro.";

      procesando = false;

      return;

    }

    descriptores.push(
      deteccion.descriptor
    );

    mensaje.innerText =
      "📷 Registrando rostro " +
      (i + 1) +
      " de 5...";

  }


  const promedio =
    promedioDescriptores(descriptores);


  localStorage.setItem(
    "cara_ruben",
    JSON.stringify(Array.from(promedio))
  );


  descriptorRegistrado = promedio;


  mensaje.innerText =
    "✅ Rubén registrado correctamente";

  estado.innerText =
    "Rostro registrado ✅";


  procesando = false;

}


/* =========================================================
   MARCAR ENTRADA / SALIDA
========================================================= */

async function marcar(movimiento) {

  if (procesando) return;

  if (!modeloListo) {

    mensaje.innerText =
      "⏳ Espera a que cargue el reconocimiento.";

    return;

  }


  if (!descriptorRegistrado) {

    mensaje.innerText =
      "⚠️ Primero debes registrar el rostro.";

    return;

  }


  procesando = true;

  mensaje.innerText =
    "🔎 Verificando rostro...";


  const deteccion =
    await detectarRostro();


  if (!deteccion) {

    mensaje.innerText =
      "❌ No se detectó ningún rostro.";

    procesando = false;

    return;

  }


  const distancia =
    faceapi.euclideanDistance(
      descriptorRegistrado,
      deteccion.descriptor
    );


  console.log(
    "Distancia facial:",
    distancia
  );


  if (distancia > DISTANCIA_MAXIMA) {

    mensaje.innerText =
      "❌ Persona no registrada.";

    procesando = false;

    return;

  }


  mensaje.innerText =
    "✅ Rubén identificado";


  enviarRegistro(movimiento);

}


/* =========================================================
   ENVIAR A GOOGLE SHEETS
========================================================= */

function enviarRegistro(movimiento) {

  const datos = new URLSearchParams();

  datos.append(
    "empleado",
    EMPLEADO
  );

  datos.append(
    "sucursal",
    SUCURSAL
  );

  datos.append(
    "movimiento",
    movimiento
  );


  fetch(URL_APPS_SCRIPT, {

    method: "POST",

    mode: "no-cors",

    headers: {
      "Content-Type":
        "application/x-www-form-urlencoded"
    },

    body: datos.toString()

  })
  .then(() => {

    mensaje.innerText =
      "✅ " +
      EMPLEADO +
      " identificado — " +
      movimiento;

    procesando = false;

  })
  .catch((error) => {

    console.error(error);

    mensaje.innerText =
      "⚠️ Rostro identificado, pero hubo un problema al guardar.";

    procesando = false;

  });

}


/* =========================================================
   PROMEDIAR DESCRIPTORES
========================================================= */

function promedioDescriptores(lista) {

  const longitud =
    lista[0].length;

  const resultado =
    new Float32Array(longitud);


  for (let i = 0; i < longitud; i++) {

    let suma = 0;

    for (const descriptor of lista) {

      suma += descriptor[i];

    }

    resultado[i] =
      suma / lista.length;

  }

  return resultado;

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/* =========================================================
   INICIAR SISTEMA
========================================================= */

iniciar();

</script>

</body>

</html>
